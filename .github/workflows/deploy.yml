name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SONAR_PROJECT_KEY: TAHDCO-OneDashboard-ss
  SONAR_PROJECT_NAME: TAHDCO OneDashboard (Unified Dashboard Platform)

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # ----------------------------------------------------------------------
      # Toolchain
      # ----------------------------------------------------------------------
      - name: Set up Java 17 (required by SonarScanner for .NET)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET SDKs (8.0 for the solution, 9.0 for API.Tests / SqlRunner)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python (PDF report generation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 11.2.1
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install PDF report dependencies
        run: python -m pip install --disable-pip-version-check --no-input "reportlab==4.2.5"

      - name: Prepare CI output directories
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/artifacts/coverage/backend" | Out-Null
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/artifacts/report" | Out-Null

      # ----------------------------------------------------------------------
      # Frontend: install, build (CI-only output), test with coverage
      # ----------------------------------------------------------------------
      - name: Frontend - install dependencies
        id: frontend_install
        working-directory: frontend
        run: npm ci

      - name: Frontend - production build (CI output dir only)
        id: frontend_build
        working-directory: frontend
        # --output-path redirects the build into frontend/dist/ci-build (already
        # git-ignored). The committed production bundle in backend/API/wwwroot,
        # which angular.json normally targets, is deliberately NOT touched.
        run: npx ng build --configuration production --output-path dist/ci-build

      - name: Frontend - unit tests with LCOV coverage
        id: frontend_tests
        continue-on-error: true
        working-directory: frontend
        run: |
          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (Test-Path $chrome) { $env:CHROME_BIN = $chrome }
          npx ng test --watch=false --code-coverage --browsers ChromeHeadlessNoSandbox

      - name: Frontend - normalise LCOV paths for SonarQube
        id: frontend_lcov_fix
        if: always()
        continue-on-error: true
        # karma-coverage writes SF: entries relative to frontend/ and with Windows
        # backslashes (e.g. "SF:src\app\...\auth.service.ts"). The scanner's project
        # base directory is the repository root, so SonarQube would fail to resolve
        # those paths and silently drop all frontend coverage. Rewriting them to
        # repo-root-relative POSIX paths fixes that. This only ever touches the
        # generated report in the git-ignored frontend/coverage folder.
        run: |
          $reports = @(Get-ChildItem -Path "${{ github.workspace }}/frontend/coverage" -Recurse -Filter 'lcov.info' -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            Write-Host "::warning::No lcov.info found - frontend coverage will not be imported."
          }
          foreach ($report in $reports) {
            $rewritten = 0
            $lines = Get-Content -LiteralPath $report.FullName
            $fixed = foreach ($line in $lines) {
              if ($line.StartsWith('SF:')) {
                $p = $line.Substring(3).Replace('\', '/')
                if ($p -notmatch '^([A-Za-z]:|/)' -and -not $p.StartsWith('frontend/')) {
                  $p = "frontend/$p"
                  $rewritten++
                }
                "SF:$p"
              } else {
                $line
              }
            }
            Set-Content -LiteralPath $report.FullName -Value $fixed -Encoding utf8
            Write-Host "Normalised $rewritten source paths in $($report.FullName)"
          }

      # ----------------------------------------------------------------------
      # SonarQube: begin -> build -> test/coverage -> end
      # ----------------------------------------------------------------------
      - name: SonarQube - begin analysis
        id: sonar_begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          $exclusions = @(
            'backend/API/wwwroot/**',
            '**/bin/**',
            '**/obj/**',
            '**/node_modules/**',
            '**/dist/**',
            'frontend/e2e/**',
            '**/*.min.js',
            '**/*.min.css',
            '**/coverage/**',
            '**/TestResults/**',
            '**/.angular/**',
            '.sonarqube/**',
            'artifacts/**'
          ) -join ','

          $coverageExclusions = @(
            'database/**',
            'frontend/src/main.ts',
            'frontend/src/environments/**',
            'frontend/e2e/**'
          ) -join ','

          $lcovPaths = 'frontend/coverage/lcov.info,frontend/coverage/tahdco-udp/lcov.info'

          # sonar.projectBaseDir is set explicitly: every MSBuild project in this
          # repository lives under backend/, so without it the scanner may derive
          # the analysis root from those projects and silently drop frontend/src
          # (Angular/TypeScript/HTML/SCSS), database/ and the frontend LCOV report.
          dotnet sonarscanner begin `
            /k:"$env:SONAR_PROJECT_KEY" `
            /n:"$env:SONAR_PROJECT_NAME" `
            /v:"${{ github.sha }}" `
            /d:sonar.projectBaseDir="${{ github.workspace }}" `
            /d:sonar.host.url="$env:SONAR_HOST_URL" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.sourceEncoding="UTF-8" `
            /d:sonar.scm.provider="git" `
            /d:sonar.exclusions="$exclusions" `
            /d:sonar.coverage.exclusions="$coverageExclusions" `
            /d:sonar.cs.opencover.reportsPaths="artifacts/coverage/backend/**/coverage.opencover.xml" `
            /d:sonar.cs.vstest.reportsPaths="artifacts/coverage/backend/*.trx" `
            /d:sonar.javascript.lcov.reportsPaths="$lcovPaths"

      - name: Backend - restore
        id: backend_restore
        run: |
          dotnet restore backend/API.sln
          dotnet restore backend/API.Tests/API.Tests.csproj
          dotnet restore backend/SqlRunner/SqlRunner.csproj

      - name: Backend - build (produces the Roslyn analysis SonarQube needs)
        id: backend_build
        # API.Tests and SqlRunner are NOT members of API.sln, so they are built
        # explicitly - otherwise their C# would never reach the analyser.
        run: |
          dotnet build backend/API.sln -c Release --no-restore --no-incremental
          dotnet build backend/API.Tests/API.Tests.csproj -c Release --no-restore --no-incremental
          dotnet build backend/SqlRunner/SqlRunner.csproj -c Release --no-restore --no-incremental

      - name: Backend - unit tests with OpenCover coverage
        id: backend_tests
        continue-on-error: true
        # Known state at the time of writing: 2 of 29 backend tests fail.
        # continue-on-error keeps the analysis and the report running; the real
        # pass/fail counts are parsed from the TRX and printed in the PDF.
        # The coverage format is forced to opencover via inline runsettings, so
        # no .csproj and no .runsettings file in the repository is modified.
        run: dotnet test backend/API.Tests/API.Tests.csproj -c Release --no-build --logger "trx;LogFileName=backend_ci_test_results.trx" --results-directory "${{ github.workspace }}/artifacts/coverage/backend" "--collect:XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: SonarQube - end analysis
        id: sonar_end
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      # TEMPORARY DIAGNOSTIC - remove once the frontend LCOV import is resolved.
      # Run 32764764754 published successfully and imported C# OpenCover, but the
      # scanner log contained zero occurrences of "lcov" and the covered-line
      # count (999) matched backend coverage exactly, i.e. the frontend LCOV was
      # not imported. This dumps what the scanner engine actually received.
      - name: DIAGNOSTIC - what did the scanner receive for coverage
        id: diag_lcov
        if: always()
        continue-on-error: true
        run: |
          $ws = "${{ github.workspace }}"
          $gen = "$ws/.sonarqube/out/sonar-project.properties"
          Write-Host "=== generated properties: coverage / lcov / exclusion keys ==="
          if (Test-Path $gen) {
            Get-Content -LiteralPath $gen |
              Where-Object { $_ -match 'lcov|coverage|exclusions|sonar\.sources|projectBaseDir' } |
              ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "  MISSING: $gen"
          }
          Write-Host ""
          Write-Host "=== SonarQubeAnalysisConfig.xml: lcov entries ==="
          $cfg = "$ws/.sonarqube/conf/SonarQubeAnalysisConfig.xml"
          if (Test-Path $cfg) {
            Select-String -LiteralPath $cfg -Pattern 'lcov' -SimpleMatch |
              ForEach-Object { Write-Host "  $($_.Line.Trim())" }
          } else {
            Write-Host "  MISSING: $cfg"
          }
          Write-Host ""
          Write-Host "=== lcov.info on disk at end-of-analysis time ==="
          foreach ($p in @("$ws/frontend/coverage/lcov.info", "$ws/frontend/coverage/tahdco-udp/lcov.info")) {
            if (Test-Path $p) {
              $sf = @(Select-String -LiteralPath $p -Pattern '^SF:' | Select-Object -First 3)
              Write-Host "  EXISTS $p  ($((Get-Item $p).Length) bytes)"
              $sf | ForEach-Object { Write-Host "     $($_.Line)" }
            } else {
              Write-Host "  ABSENT $p"
            }
          }

      # ----------------------------------------------------------------------
      # Report
      # ----------------------------------------------------------------------
      - name: Collect build / test / coverage status
        id: ci_status
        if: always()
        run: |
          $ws = "${{ github.workspace }}"
          $covDir = "$ws/artifacts/coverage/backend"

          $openCover = @(Get-ChildItem -Path $covDir -Recurse -Filter 'coverage.opencover.xml' -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          $trxFiles  = @(Get-ChildItem -Path $covDir -Recurse -Filter '*.trx' -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          $lcovFiles = @(Get-ChildItem -Path "$ws/frontend/coverage" -Recurse -Filter 'lcov.info' -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })

          $backendCounters = $null
          if ($trxFiles.Count -gt 0) {
            try {
              [xml]$trx = Get-Content -LiteralPath $trxFiles[0] -Raw
              $c = $trx.TestRun.ResultSummary.Counters
              $backendCounters = [ordered]@{
                total    = [int]$c.total
                executed = [int]$c.executed
                passed   = [int]$c.passed
                failed   = [int]$c.failed
                skipped  = [int]$c.notExecuted
              }
            } catch {
              Write-Host "::warning::Could not parse TRX counters: $($_.Exception.Message)"
            }
          }

          $status = [ordered]@{
            steps = [ordered]@{
              frontend_install = '${{ steps.frontend_install.outcome }}'
              frontend_build   = '${{ steps.frontend_build.outcome }}'
              frontend_tests   = '${{ steps.frontend_tests.outcome }}'
              frontend_lcov_fix = '${{ steps.frontend_lcov_fix.outcome }}'
              sonar_begin      = '${{ steps.sonar_begin.outcome }}'
              backend_restore  = '${{ steps.backend_restore.outcome }}'
              backend_build    = '${{ steps.backend_build.outcome }}'
              backend_tests    = '${{ steps.backend_tests.outcome }}'
              sonar_end        = '${{ steps.sonar_end.outcome }}'
            }
            coverage = [ordered]@{
              backend_opencover_reports = $openCover
              frontend_lcov_reports     = $lcovFiles
            }
            backend_test_counters = $backendCounters
            run = [ordered]@{
              run_id     = '${{ github.run_id }}'
              run_number = '${{ github.run_number }}'
              actor      = '${{ github.actor }}'
              repository = '${{ github.repository }}'
            }
          }

          $status | ConvertTo-Json -Depth 8 | Out-File -FilePath "$ws/artifacts/ci-status.json" -Encoding utf8
          Write-Host "--- ci-status.json ---"
          Get-Content -LiteralPath "$ws/artifacts/ci-status.json"

      - name: Generate SonarQube PDF report
        id: pdf
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          python scripts/generate_sonar_report.py `
            --project-key "$env:SONAR_PROJECT_KEY" `
            --project-name "$env:SONAR_PROJECT_NAME" `
            --branch "${{ github.ref_name }}" `
            --commit "${{ github.sha }}" `
            --report-task-file ".sonarqube/out/.sonar/report-task.txt" `
            --status-file "${{ github.workspace }}/artifacts/ci-status.json" `
            --output "${{ github.workspace }}/artifacts/report/TAHDCO-OneDashboard-SonarQube-Report.pdf"

      - name: Upload SonarQube PDF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TAHDCO-OneDashboard-SonarQube-Report
          path: artifacts/report/TAHDCO-OneDashboard-SonarQube-Report.pdf
          # A missing PDF must surface as a CI failure, never as a silent no-op.
          if-no-files-found: error
          retention-days: 30

      # Quality Gate is REPORTING ONLY for this first implementation: its real
      # status and conditions are fetched from the SonarQube Web API and printed
      # in the PDF. Nothing here fails the job on a red gate.
      - name: Quality Gate summary (reporting only)
        if: always()
        run: |
          if ('${{ steps.sonar_end.outcome }}' -ne 'success') {
            Write-Host "::warning::SonarQube analysis did not complete successfully - see the PDF report for details."
          }
          if ('${{ steps.backend_tests.outcome }}' -ne 'success') {
            Write-Host "::warning::Backend unit tests reported failures - backend coverage must not be treated as healthy."
          }
          if ('${{ steps.frontend_tests.outcome }}' -ne 'success') {
            Write-Host "::warning::Frontend unit tests did not complete - frontend coverage may be unavailable."
          }
